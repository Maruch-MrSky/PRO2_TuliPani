spring:
  config:
    import: optional:file:.env[.properties]
    # Datasource/JPA settings were moved to the legacy `supabase` profile and
    # removed from the default configuration. Use the `supabase-api` profile
    # to run the application without a direct JDBC/Postgres connection.
  jackson:
    time-zone: UTC

server:
  port: 8080

logging:
  level:
    org.hibernate.SQL: debug