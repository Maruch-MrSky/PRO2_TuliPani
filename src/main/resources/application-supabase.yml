spring:
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://${SUPABASE_DB_HOST:db.mvuftpomwptrgzchyeoh.supabase.co}:${SUPABASE_DB_PORT:5432}/${SUPABASE_DB_NAME:postgres}?${SUPABASE_DB_PARAMS:sslmode=require}}
    username: ${SPRING_DATASOURCE_USERNAME:postgres}
    # Do not provide a default here; set it via env var/secret.
    password: ${SPRING_DATASOURCE_PASSWORD}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: none
    open-in-view: false
    properties:
      hibernate:
        default_schema: public
        format_sql: true
