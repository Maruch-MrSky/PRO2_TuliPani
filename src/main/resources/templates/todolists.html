<!doctype html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="utf-8" />
  <title>Todolists</title>
  <style>
    body { font-family: Arial, sans-serif; margin: 2rem; }
    ul { list-style: none; padding: 0; }
    li { margin: 0.5rem 0; }
    form { margin-top: 1rem; }
  </style>
</head>
<body>
  <h1>My Todolists</h1>

  <div th:if="${lists == null || #lists.isEmpty(lists)}">
    <p>No todo lists yet.</p>
  </div>

  <ul>
    <li th:each="t : ${lists}">
      <a th:href="@{/ui/todolists/{id}(id=${t.todolistId}, authId=${authId})}" th:text="${t.name}">List</a>
    </li>
  </ul>

  <form th:action="@{/ui/todolists}" method="post">
    <input type="hidden" name="authId" th:value="${authId}" />
    <input type="text" name="name" placeholder="New list name" required />
    <input type="text" name="listType" placeholder="Type (optional)" />
    <button type="submit">Create</button>
  </form>

</body>
</html>
